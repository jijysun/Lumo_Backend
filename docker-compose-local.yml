services:
  # 테스트용 docker-compose 파일입니다
  # 완전히 다른 인스턴스를 파서 테스팅하였습니다.

  spring:
    build: .
    image: jijysun/lumo:latest
    container_name: Lumo_Blue
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-local:3306/lumo_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      # application.yaml 의 spring.mail.port 가 587 로 하드코딩되어 있어 여기서 덮어쓴다.
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    env_file: .env
    depends_on:
      - mysql-local
      - mailpit
    networks:
      - lumo-test-network
    restart: on-failure

  mysql-local:
    image: mysql:8.0
    container_name: Lumo_MySQL_Local
    environment:
      - MYSQL_DATABASE=lumo_test
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3307:3306"
    networks:
      - lumo-test-network

  # Cache: Redis
  redis-local:
    image: redis:alpine
    container_name: Lumo_Redis_Local
    ports:
      - "6380:6379"
    networks:
      - lumo-test-network

  # Mail: Mailpit (테스트의 핵심)
  # MailHog 는 2020 년 이후 유지보수가 중단되어 Mailpit 으로 교체.
  # 포트(1025/8025)와 API 가 호환되는 드롭인 대체재다.
  mailpit:
    image: axllent/mailpit:latest
    container_name: Lumo_Mailpit
    environment:
      # MailHog 와 달리 Mailpit 은 기본적으로 SMTP AUTH 를 거부한다.
      # 앱이 username/password 를 들고 접속하므로 아무 자격증명이나 수락하도록 연다.
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
      # 기본 보관 상한 500 통. 부하 테스트에서 수신 건수를 세려면 무제한이어야 한다.
      - MP_MAX_MESSAGES=0
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI
    networks:
      - lumo-test-network

  # Metrics: Prometheus
  prometheus-local:
    image: prom/prometheus:latest
    container_name: Lumo_Prometheus_Local
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-local.yaml:/etc/prometheus/prometheus-local.yaml
    command:
      - '--config.file=/etc/prometheus/prometheus-local.yaml'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lumo-test-network

  # Visualization: Grafana
  grafana-local:
    image: grafana/grafana:latest
    container_name: Lumo_Grafana_Local
    ports:
      - "3000:3000"
    environment:
      # (M-8) 로컬은 기본값을 허용하되 값 자체는 환경변수로 뺀다.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus-local
    networks:
      - lumo-test-network

networks:
  lumo-test-network:
    driver: bridge