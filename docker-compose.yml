# 이미지 태그는 .env 또는 셸 환경변수로 지정한다.
#   예) LUMO_TAG=ctrl-7a28965 docker compose up -d Blue
#   미지정 시 latest 로 동작하므로 기존 배포 흐름과 호환된다.
services:
  Blue:
    # build 지시자를 두지 않는다 — EC2 에는 소스가 없고(scp 대상은 compose·deploy.sh·monitoring 뿐),
    image: ${LUMO_IMAGE:-jijysun/lumo}:${LUMO_TAG:-latest}
    container_name: Lumo_Blue
    ports:
      - "8081:8080"
    #    depends_on:
    #      - redis
    environment:
      # application.yaml 의 spring.mail.port 가 587 로 하드코딩되어 있다.
      # 미지정 시 587(현행 동작), 측정 회차에는 SPRING_MAIL_PORT=1025 로 Mailpit 을 가리킨다.
      # 호스트는 .env 의 MAIL_SENDER_HOST 로 계속 제어한다 (측정 시 mailpit).
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
    env_file: .env
    networks:
      - my-network
    restart: on-failure

  Green:
    # Blue 와 동일 — 이미지는 pull 만
    image: ${LUMO_IMAGE:-jijysun/lumo}:${LUMO_TAG:-latest}
    container_name: Lumo_Green
    ports:
      - "8082:8080"
    environment:
      # application.yaml 의 spring.mail.port 가 587 로 하드코딩되어 있다.
      # 미지정 시 587(현행 동작), 측정 회차에는 SPRING_MAIL_PORT=1025 로 Mailpit 을 가리킨다.
      # 호스트는 .env 의 MAIL_SENDER_HOST 로 계속 제어한다 (측정 시 mailpit).
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
    env_file: .env
    networks:
      - my-network
    restart: on-failure

  #  redis:
  #    image: redis:alpine
  #    container_name: Lumo_Redis
  #    ports:
  #      - "6379:6379"
  #    volumes:
  #      - redis_data:/data
  #    networks:
  #      - lumo-network
  #    restart: on-failure

  # 측정용 메일 sink. 평상시에는 기동하지 않고 profile 을 명시할 때만 뜬다.
  #   docker compose --profile measure up -d mailpit
  # SMTP(1025) 는 호스트에 노출하지 않는다 — 앱이 my-network 내부에서 mailpit:1025 로 접속한다.
  # 웹 UI(8025) 만 노출하며, 접근 제한은 보안그룹에서 본인 IP 만 허용하는 것으로 처리한다.
  mailpit:
    image: axllent/mailpit:latest
    container_name: Lumo_Mailpit
    profiles: ["measure"]
    environment:
      # Mailpit 은 기본적으로 SMTP AUTH 를 거부한다. 앱이 자격증명을 들고 오므로 열어준다.
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
      # ⚠️ 기본 보관 상한이 500 통이다. 그대로 두면 1000 건 부하 시 오래된 메일이 잘려나가
      #    "수신 건수 = 소실 측정" 자체가 무너진다. 0 = 무제한.
      - MP_MAX_MESSAGES=0
    ports:
      - "8025:8025" # Web UI (보안그룹에서 본인 IP 만 허용)
    networks:
      - my-network
    restart: unless-stopped

  # 이후 성능 측정 툴 대비
  prometheus:
    image: prom/prometheus:latest
    container_name: Lumo_Prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: Lumo_Grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # (M-8) 하드코딩 제거. .env / GitHub Secrets(GRAFANA_ADMIN_PASSWORD)로 주입한다.
      #       미지정 시 기동을 막지 않되 기본값이 그대로 노출되지 않도록 필수값으로 둔다.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 설정하세요}
      - GF_USERS_ALLOW_SIGN_UP=false # 회원가입 비활성화
    depends_on:
      - prometheus
    networks:
      - my-network
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: Lumo_Loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml
    command:
      - -config.file=/etc/loki/local-config.yaml
    networks:
      - my-network
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: Lumo_Promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # 호스트 로그 경로 추가
    command:
      - -config.file=/etc/promtail/config.yaml
    networks:
      - my-network
    restart: always

volumes:
  grafana_data: # Grafana 데이터 영속성을 위한 볼륨 정의
  prometheus_data:
#  redis_data:

networks:
  my-network:
    driver: bridge