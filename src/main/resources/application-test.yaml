spring:
  config:
    activate:
      on-profile: test

  # < 로컬 테스트용 test 프로필 입니다. >
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql-local:3306/lumo_test
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: mailhog
    port: 1025
    username: dummy
    password: dummy
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  data:
    redis:
      host: redis-local
      port: 6379

  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret:
    # 로컬 test 프로파일 전용 더미 키 (운영 키 아님).
    # C-4 수정으로 이 값은 Base64 "디코딩" 되므로, 디코딩 후 32바이트(256bit) 이상이어야 한다.
    # 이전 값 'aksdbfkahskdjfhaks'(18바이트)는 규격 미달이라 기동 자체가 실패했다 (M-17).
    # 운영 키 생성: openssl rand -base64 32
    key: bHVtby1sb2NhbC10ZXN0LXNlY3JldC1rZXktMzJieXQ=