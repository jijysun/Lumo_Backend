spring:
  application:
    name: lumo-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
#        show_sql: true
#        format_sql: true
#        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000
  mail:
    host: ${MAIL_SENDER_HOST}
    port: 587
    username: ${MAIL_SENDER_USERNAME}
    password: ${MAIL_SENDER_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
#      ssl:
#        enabled: true

  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus # health + prometheus 엔드포인트 노출
      cors:
        allowed-headers: "*"
        allowed-methods: GET
  endpoint:
    health:
      show-details: always # 상세 상태 확인

# CORS 허용 Origin. 콤마 구분.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

# 부하 테스트용 회원 시딩 (LoadTestUserSeeder)
# enabled=true 일 때만 빈이 등록된다. 기본값 false 이므로 평상시 배포에는 영향 없음.
# .env 는 배포마다 workflow 가 덮어쓰므로 측정 회차 변수는 셸 환경변수로 주입할 것.
#   LOADTEST_SEED_ENABLED=true LOADTEST_SEED_USER_COUNT=500 sudo -E docker compose up -d Blue
loadtest:
  seed:
    enabled: ${LOADTEST_SEED_ENABLED:false}
    user-count: ${LOADTEST_SEED_USER_COUNT:0}
    email-domain: ${LOADTEST_SEED_EMAIL_DOMAIN:loadtest.invalid}
    password: ${LOADTEST_SEED_PASSWORD:loadtest1234!}