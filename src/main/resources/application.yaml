spring:
  application:
    name: lumo-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
#        show_sql: true
#        format_sql: true
#        use_sql_comments: true
        # (M-2) update -> validate. 스키마는 Flyway 가 만들고 Hibernate 는 대조만 한다.
        # update 는 컬럼 삭제를 반영하지 않아 드리프트가 누적되고, 중복 행이 있으면
        # 유니크 제약 추가가 실패해도 로그만 남기고 조용히 넘어간다 (M-13 이 그 사례).
        hbm2ddl:
          auto: validate
        default_batch_fetch_size: 1000
  mail:
    host: ${MAIL_SENDER_HOST}
    port: 587
    username: ${MAIL_SENDER_USERNAME}
    password: ${MAIL_SENDER_PASSWORD}
    # (D-4) JavaMail 의 기본 타임아웃은 "무한 대기" 다.
    #   SMTP 가 응답을 주지 않으면 워커 스레드가 영원히 블록되고, 그러면
    #   graceful shutdown 을 아무리 넉넉히 잡아도 awaitTermination 이 타임아웃으로 끝나
    #   결국 SIGKILL 을 맞는다. 상한이 있어야 종료 예산 계산이 성립한다.
    #
    #   부수 효과 — mail.send.duration 의 꼬리가 잘려 G-4 Little's Law 의 입력값이 안정된다.
    #   (로컬에서 건당 소요가 175ms ↔ 946ms 로 3.2배 흔들렸던 것과 무관하지 않다)
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
#      ssl:
#        enabled: true

  sql:
    init:
      mode: never

  # (D-5) graceful shutdown 의 상한.
  #   Tomcat 이 진행 중인 요청을 마저 처리할 때까지 기다리는 시간이다.
  #   기본값 30초는 블루-그린 전환 대기로는 길다 — deploy.sh 는 nginx 를 먼저 돌려놓았으므로
  #   신규 요청은 이미 새 컨테이너로 가고, 여기서 기다리는 것은 "이미 들어와 처리 중이던" 요청뿐이다.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # (M-2) 마이그레이션은 src/main/resources/db/migration 의 V*.sql 로만 적용한다.
  # baseline-on-migrate: 이력 테이블이 없는 기존 DB(스냅샷 복원 등)를 만나면
  #   V1 을 이미 적용된 것으로 간주하고 V2 부터 실행한다. 새 DB 는 V1 부터 전부 실행된다.
  # (H-10) @Scheduled 는 @Async 와 완전히 다른 인프라를 쓴다 — TaskScheduler 는 기본 스레드 1개다.
  # MailRecoveryScheduler 가 회수분 SMTP 를 그 스레드에서 처리하면 타 도메인 배치(자정 통계 등)가
  # 그 뒤로 줄을 서서 조용히 수 분씩 늦게 돈다. 예외가 안 나므로 아무도 모르는 유형의 지연이다.
  task:
    scheduling:
      pool:
        size: 4

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

# (D-5) 종료 시 Tomcat 이 새 요청 수락을 멈추고 진행 중인 것만 마저 처리한다.
#   기본값은 immediate 라 전환 순간 처리 중이던 요청이 응답 없이 끊겼다.
#   nginx 를 먼저 전환하므로 신규 요청은 이미 새 컨테이너로 가고, 이 설정은 그 사이에
#   "이미 들어와 있던" 요청을 구한다.
server:
  shutdown: graceful

management:
  # (20260821) Grafana 대시보드 20727 은 상단 변수로 application 라벨을 요구한다.
  # 이 태그가 없으면 $application 에 값이 없어 대시보드의 모든 패널이 빈 화면으로 나온다.
  metrics:
    tags:
      application: ${spring.application.name}
    # 부하 테스트 판정을 서버 측 지표로 옮기기 위한 설정.
    #
    # k6 의 http_req_duration 에는 네트워크 RTT 가 포함된다. 로컬에서 EC2 로 쏘면
    # 수락 계층 응답시간(로컬 실측 p95 3.7ms)보다 RTT 가 더 커서 측정값의 대부분이
    # 네트워크가 된다. http_server_requests 는 Tomcat 이 요청을 받아 응답을 쓸 때까지만
    # 재므로 부하 생성기 위치와 무관하다 — 개선 전후 비교는 이 값으로 한다.
    distribution:
      # 버킷을 Prometheus 로 보내 histogram_quantile() 로 집계한다.
      # 클라이언트 측 percentiles 와 달리 Blue/Green 두 인스턴스의 값을 합쳐도 백분위가 깨지지 않는다.
      percentiles-histogram:
        http.server.requests: true
      # 상한을 두지 않으면 수십 초짜리 버킷까지 생성된다.
      # uri/method/status/outcome 태그와 곱해지므로 시계열 증가가 체감된다.
      maximum-expected-value:
        http.server.requests: 2s
  endpoints:
    web:
      exposure:
        include: health, prometheus # health + prometheus 엔드포인트 노출
      cors:
        allowed-headers: "*"
        allowed-methods: GET
  endpoint:
    health:
      show-details: always # 상세 상태 확인

# CORS 허용 Origin. 콤마 구분.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

# 부하 테스트용 회원 시딩 (LoadTestUserSeeder)
# enabled=true 일 때만 빈이 등록된다. 기본값 false 이므로 평상시 배포에는 영향 없음.
# .env 는 배포마다 workflow 가 덮어쓰므로 측정 회차 변수는 셸 환경변수로 주입할 것.
#   LOADTEST_SEED_ENABLED=true LOADTEST_SEED_USER_COUNT=500 sudo -E docker compose up -d Blue
# 메일 발송 워커 수 (M-24).
# AsyncConfig.mailWorkerExecutor 의 core/max 와 WorkerInitializer 의 기동 개수를 동시에 결정한다.
# G-4(워커 수 근거 확보)는 이 값을 바꿔가며 재는 것이 전제이므로 재빌드 없이 조정 가능해야 한다.
#   MAIL_WORKER_COUNT=30 sudo -E docker compose up -d Blue
mail:
  worker:
    count: ${MAIL_WORKER_COUNT:15}

loadtest:
  seed:
    enabled: ${LOADTEST_SEED_ENABLED:false}
    user-count: ${LOADTEST_SEED_USER_COUNT:0}
    email-domain: ${LOADTEST_SEED_EMAIL_DOMAIN:loadtest.invalid}
    password: ${LOADTEST_SEED_PASSWORD:loadtest1234!}