spring:
  application:
    name: lumo-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
#        show_sql: true
#        format_sql: true
#        use_sql_comments: true
        # (M-2) update -> validate. 스키마는 Flyway 가 만들고 Hibernate 는 대조만 한다.
        # update 는 컬럼 삭제를 반영하지 않아 드리프트가 누적되고, 중복 행이 있으면
        # 유니크 제약 추가가 실패해도 로그만 남기고 조용히 넘어간다 (M-13 이 그 사례).
        hbm2ddl:
          auto: validate
        default_batch_fetch_size: 1000
  mail:
    host: ${MAIL_SENDER_HOST}
    port: 587
    username: ${MAIL_SENDER_USERNAME}
    password: ${MAIL_SENDER_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
#      ssl:
#        enabled: true

  sql:
    init:
      mode: never

  # (M-2) 마이그레이션은 src/main/resources/db/migration 의 V*.sql 로만 적용한다.
  # baseline-on-migrate: 이력 테이블이 없는 기존 DB(스냅샷 복원 등)를 만나면
  #   V1 을 이미 적용된 것으로 간주하고 V2 부터 실행한다. 새 DB 는 V1 부터 전부 실행된다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus # health + prometheus 엔드포인트 노출
      cors:
        allowed-headers: "*"
        allowed-methods: GET
  endpoint:
    health:
      show-details: always # 상세 상태 확인

# CORS 허용 Origin. 콤마 구분.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

# 부하 테스트용 회원 시딩 (LoadTestUserSeeder)
# enabled=true 일 때만 빈이 등록된다. 기본값 false 이므로 평상시 배포에는 영향 없음.
# .env 는 배포마다 workflow 가 덮어쓰므로 측정 회차 변수는 셸 환경변수로 주입할 것.
#   LOADTEST_SEED_ENABLED=true LOADTEST_SEED_USER_COUNT=500 sudo -E docker compose up -d Blue
loadtest:
  seed:
    enabled: ${LOADTEST_SEED_ENABLED:false}
    user-count: ${LOADTEST_SEED_USER_COUNT:0}
    email-domain: ${LOADTEST_SEED_EMAIL_DOMAIN:loadtest.invalid}
    password: ${LOADTEST_SEED_PASSWORD:loadtest1234!}